version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=cleancity.db
      - SECRET_KEY=cleancity-gvmc-vizag-secret-CHANGE-ME
    volumes:
      - ./data:/app/data
    restart: unless-stopped

